# harness/qualityflow-ready-tests.yaml — QualityFlow on the `ready-tests` label.
#
# Same QualityFlow pipeline as the pinned upstream harness (see config.yaml),
# but dispatched by a label instead of the /fs-plan-tests slash command.
# The label is set by a check_run bridge workflow when codecov's patch check
# lands (label-bridge recipe: check_run → `ready-tests` label → CEL), so this
# runs QualityFlow at the measured coverage gap without any core change.
#
# `trigger:` is NOT inherited from base, so this child owns its own; the
# /fs-plan-tests trigger on the base harness keeps working side by side.
base: https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/f6311b4f30ee5c23c597dba07bccc8ac0aa991be/harness/qualityflow.yaml#sha256=c0a51b2f75172aebd577fd38c8012a7c566a84f84812ebd9aa4cc07ad3b2220e

# CEL trigger (ADR 0061): fire once when `ready-tests` is added to a non-fork PR.
trigger: |
  event.entity.kind == "change_proposal"
    && event.transition.kind == "label_changed"
    && event.transition.label.name == "ready-tests"
    && event.transition.label.action == "added"
    && has(event.state.change_proposal)
    && !event.state.change_proposal.is_fork

description: "QualityFlow on ready-tests label: plan tests at the measured coverage gap"
