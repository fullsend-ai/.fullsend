    - source: https://raw.githubusercontent.com/fullsend-ai/agents/9fe3a191c5e057c6a62d035f37ad113f0dd258bf/harness/fix.yaml#sha256=f95bfe44d6602a1ce9d8983aa88151f11c788af0e5dcce03811e92fb45a80513
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/9fe3a191c5e057c6a62d035f37ad113f0dd258bf/harness/review.yaml#sha256=e402b99c217246f7f808f6dc022fb63f014a00e6ddcc05fba066f02152e566de
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/9fe3a191c5e057c6a62d035f37ad113f0dd258bf/harness/retro.yaml#sha256=35c67a40611f86e126b72e6f5b901585ebe6298494bb327cf09015b549ee44fc
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/9fe3a191c5e057c6a62d035f37ad113f0dd258bf/harness/prioritize.yaml#sha256=fd0e89a74eb6cdff58f6e703a40ed54a9911ac2ac2328fd39804bf006f4200fa
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/9fe3a191c5e057c6a62d035f37ad113f0dd258bf/harness/scribe.yaml#sha256=3ac49476b414857058fa1142b77a64d93b3595551642fe9319456168f98bc749
