# fullsend organization configuration
# https://github.com/fullsend-ai/fullsend
#
# This file is managed by fullsend. Manual edits may be overwritten.
version: "1"
dispatch:
    platform: github-actions
    mode: oidc-mint
inference:
    provider: vertex
defaults:
    roles:
        - fullsend
        - triage
        - coder
        - review
        - retro
        - prioritize
        - qualityflow
    runtime: claude
    max_implementation_retries: 2
    auto_merge: false
repos:
    .fullsend:
        enabled: false
    agents:
        enabled: true
    experiments:
        enabled: true
    fullsend:
        enabled: true
    metrics:
        enabled: true
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/
create_issues:
    allow_targets:
        orgs:
            - fullsend-ai
        repos:
            - fullsend-ai/fullsend
agents:
  - source: https://raw.githubusercontent.com/fullsend-ai/agents/937a16b672ac0b535660b358f89e2538afc0bf4b/harness/triage.yaml#sha256=f56cbb0a3c1cb71563aa1b2fb80ca9ecb922e4c832f886e8154e2e9beb6b56c6
