  - source: https://raw.githubusercontent.com/fullsend-ai/agents/937a16b672ac0b535660b358f89e2538afc0bf4b/harness/fix.yaml#sha256=5af5a1658ea36dd0982a475b08e51246224a52a3cdcfd805e837a16a286b6756
  - source: https://raw.githubusercontent.com/fullsend-ai/agents/937a16b672ac0b535660b358f89e2538afc0bf4b/harness/review.yaml#sha256=6b5cd38510ffe0526c46d8172371e9602634254841abe3e8a8e0ce183d9ef7b9
