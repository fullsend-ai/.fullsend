# fullsend-ai fleet manifest (ADR 0057, ADR 0122).
#
# This file is the only place fleet configuration is edited. Every repository
# listed here gets a managed .fullsend/config.yaml rendered from defaults.config
# plus its own entry; the shim and prioritize caller are rendered from the
# scaffold templates at github.fullsend_ref. Edits land through a pull request
# here (the manifest-check workflow runs `repos status` and a dry run on it) and
# are applied by sync-scaffold on each fullsend release, weekly, or by hand.
#
# defaults.config is fullsend-ai/fullsend's own configuration, as proposed by
# `fullsend repos status`, minus the three parts that stay on the entries that
# use them: the QualityFlow agent source, its allowed_remote_resources prefix
# and the org-wide create_issues target.
#
# signoff is intentionally not set: the sync workflow runs under a GitHub App
# installation token, whose identity cannot be resolved for a Signed-off-by
# trailer, and the DCO check exempts App-authored commits.
version: 1
defaults:
    inference:
        auth: vertex-wif
    config:
        version: "1"
        runtime: claude
        roles:
            - fullsend
            - triage
            - coder
            - review
            - retro
            - prioritize
        agents:
            - name: code
              runtime: claude
              model: opus
            - name: fix
              model: sonnet
            - name: prioritize
              runtime: pi
              model: google-vertex/gemini-3.8-flash
            - name: review
              runtime: pi
              model: sonnet
              subagents:
                challenger: opus
                correctness: openai/gpt-6.1-sol
                docs-currency: google-vertex/gemini-3.8-flash
                intent-coherence: google-vertex/gemini-3.8-flash
                risk-assessment: google-vertex/gemini-3.8-flash
                security: openai/gpt-6.1-sol
                style-conventions: google-vertex/gemini-3.8-flash
            # Retro stays installed but disabled while duplicate findings are
            # reduced (fullsend-ai/agents#198, fullsend-ai/fullsend#7805).
            - name: retro
              model: sonnet
              enabled: false
            - name: triage
              model: sonnet
        create_issues:
            allow_targets:
                repos:
                    - fullsend-ai/fullsend
        status_notifications:
            reaction:
                start: enabled
                completion: enabled
github:
    mint_url: https://mint.fullsend.sh
    fullsend_ref: main
    repos:
        # --- platform repositories ---
        - name: fullsend-ai/fullsend
          config:
            agents:
                - source: https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/572ba470c8d1e539516620adcc92bbee1863a3a1/harness/qualityflow.yaml#sha256=c0a51b2f75172aebd577fd38c8012a7c566a84f84812ebd9aa4cc07ad3b2220e
            allowed_remote_resources:
                - https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/
            create_issues:
                allow_targets:
                    orgs:
                        - fullsend-ai
                    repos:
                        - fullsend-ai/fullsend
        - name: fullsend-ai/agents
          config:
            models:
                aliases:
                    opus: claude-opus-5-5
                    sonnet: claude-sonnet-5-5
            agents:
                - source: https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/572ba470c8d1e539516620adcc92bbee1863a3a1/harness/qualityflow.yaml#sha256=c0a51b2f75172aebd577fd38c8012a7c566a84f84812ebd9aa4cc07ad3b2220e
            allowed_remote_resources:
                - https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/
            create_issues:
                allow_targets:
                    orgs:
                        - fullsend-ai
                    repos:
                        - fullsend-ai/fullsend
        # experiments dropped the QualityFlow harness (fullsend-ai/experiments#63): the
        # pinned source no longer resolves, so it runs the fleet default agents only.
        - name: fullsend-ai/experiments
          config:
            create_issues:
                allow_targets:
                    orgs:
                        - fullsend-ai
                    repos:
                        - fullsend-ai/fullsend
        - name: fullsend-ai/metrics
          config:
            roles:
                - triage
                - coder
                - review
                - fix
                - retro
                - prioritize
            create_issues:
                allow_targets:
                    repos:
                        - fullsend-ai/metrics
                        - fullsend-ai/fullsend
        # --- pi extension repositories: pi runtime, Grok triage/review, dev GCP project.
        # They inherit the fleet review subagents; retro stays enabled here on purpose.
        - name: fullsend-ai/pi-anthropic-vertex
          config:
            runtime: pi
            roles:
                - triage
                - coder
                - review
                - fix
                - retro
                - prioritize
            agents:
                - name: triage
                  model: xai-vertex/xai/grok-4.6
                - name: review
                  model: xai-vertex/xai/grok-4.6
                - name: prioritize
                  model: google-vertex/gemini-3.7-flash
                - name: code
                  runtime: claude
                  model: sonnet
                - name: fix
                  runtime: claude
                  model: sonnet
                - name: retro
                  runtime: claude
                  model: sonnet
                  enabled: true
            models:
                aliases:
                    sonnet: claude-sonnet-5
            create_issues:
                allow_targets:
                    repos:
                        - fullsend-ai/pi-anthropic-vertex
                        - fullsend-ai/fullsend
            mint_url: https://mint.fullsend.sh
            inference:
                project: it-gcp-konflux-dev-fullsend
                wif_provider: projects/855403973659/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-fullsend-ai-pi-anthropic-vert
        - name: fullsend-ai/pi-xai-vertex
          config:
            runtime: pi
            roles:
                - triage
                - coder
                - review
                - fix
                - retro
                - prioritize
            agents:
                - name: triage
                  model: xai-vertex/xai/grok-4.6
                - name: review
                  model: xai-vertex/xai/grok-4.6
                - name: prioritize
                  model: google-vertex/gemini-3.7-flash
                - name: code
                  runtime: claude
                  model: sonnet
                - name: fix
                  runtime: claude
                  model: sonnet
                - name: retro
                  runtime: claude
                  model: sonnet
                  enabled: true
            models:
                aliases:
                    sonnet: claude-sonnet-5
            create_issues:
                allow_targets:
                    repos:
                        - fullsend-ai/pi-xai-vertex
                        - fullsend-ai/fullsend
            mint_url: https://mint.fullsend.sh
            inference:
                project: it-gcp-konflux-dev-fullsend
                wif_provider: projects/855403973659/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-fullsend-ai-pi-xai-vertex
        # pi-inference-gateway carried a .fullsend/config.base.yaml copy of fullsend's
        # config (0f22284c, 2026-10-09). Its deltas over defaults.config are declared
        # here instead and the base file is removed in the adoption PR, because a
        # remote config_base fails to load in whole-manifest runs
        # (fullsend-ai/fullsend#8516).
        - name: fullsend-ai/pi-inference-gateway
          config:
            models:
                aliases:
                    opus: claude-opus-5-5
                    sonnet: claude-sonnet-5-5
            agents:
                - source: https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/572ba470c8d1e539516620adcc92bbee1863a3a1/harness/qualityflow.yaml#sha256=c0a51b2f75172aebd577fd38c8012a7c566a84f84812ebd9aa4cc07ad3b2220e
            allowed_remote_resources:
                - https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow-fullsend/
            # The overlay's create_issues replaced the base's org-wide target, so the
            # effective allow-list today is these two repositories; kept as is.
            create_issues:
                allow_targets:
                    repos:
                        - fullsend-ai/pi-inference-gateway
                        - fullsend-ai/fullsend
            inference:
                project: it-gcp-konflux-prod-fullsend
                wif_provider: projects/155031062349/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-fullsend-ai-pi-inference-gate
        # --- agent repositories transferred from opendatahub-io, 2026-10-16 ---
        - name: fullsend-ai/epic-creator
        - name: fullsend-ai/strat-creator
        - name: fullsend-ai/assess-rfe
        - name: fullsend-ai/agent-eval-harness
        - name: fullsend-ai/rfe-creator
          config:
            agents:
                - source: rfe-creator/rfe-creator.yaml
            allowed_remote_resources:
                - https://raw.githubusercontent.com/fullsend-ai/rfe-creator/
        - name: fullsend-ai/test-creator
          config:
            agents:
                - source: test-plan/test-plan.yaml
                - source: test-plan/test-plan-dry-run.yaml
            allowed_remote_resources:
                - https://raw.githubusercontent.com/fullsend-ai/test-creator/
