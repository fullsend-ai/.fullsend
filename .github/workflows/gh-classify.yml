name: Classify GitHub Issues

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: "Event source (issues for shim dispatch, manual for workflow_dispatch)"
        required: false
        type: string
        default: "manual"
      source_repo:
        description: "Owner/repo to classify issues in"
        required: false
        type: string
      event_payload:
        description: "JSON payload from shim (contains issue.number, issue.html_url)"
        required: false
        type: string
      classify_mode:
        description: "Classification mode"
        required: false
        type: choice
        options:
          - single
          - unclassified
          - all
        default: "unclassified"
      issue_number:
        description: "Specific issue number (single mode only)"
        required: false
        type: string
      dry_run:
        description: "Dry run (no writes)"
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "false"
      min_confidence:
        description: "Minimum confidence threshold (0.0-1.0)"
        required: false
        type: string
        default: "0.7"
      filter_category:
        description: "Only classify into this category (leave empty for all categories)"
        required: false
        type: string
      screen_issues:
        description: "Screen issues by title/labels before fetching details (disable for thorough evaluation)"
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

concurrency:
  group: fullsend-gh-classify-${{ inputs.classify_mode }}-${{ inputs.issue_number || 'batch' }}
  cancel-in-progress: true

jobs:
  gh-classify:
    name: Classify Issues
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Checkout .fullsend repository
        uses: actions/checkout@v6

      - name: Checkout upstream defaults
        uses: actions/checkout@v6
        with:
          repository: fullsend-ai/fullsend
          ref: v0
          path: .defaults
          sparse-checkout: |
            internal/scaffold/fullsend-repo/

      - name: Prepare workspace (upstream defaults + org overrides)
        run: |
          set -euo pipefail
          SRC=".defaults/internal/scaffold/fullsend-repo"
          LAYERED_DIRS="agents skills schemas harness policies scripts env"
          for dir in ${LAYERED_DIRS}; do
            if [[ -d "${SRC}/${dir}" ]]; then
              mkdir -p "${dir}"
              cp -r "${SRC}/${dir}/." "${dir}/"
            fi
          done
          for dir in ${LAYERED_DIRS}; do
            if [[ -d "customized/${dir}" ]]; then
              find "customized/${dir}" -type f ! -name '.gitkeep' -print0 \
                | while IFS= read -r -d '' f; do
                    rel="${f#customized/}"
                    mkdir -p "$(dirname "${rel}")"
                    cp "${f}" "${rel}"
                  done
            fi
          done
          mkdir -p .github/scripts
          cp "${SRC}/.github/scripts/setup-agent-env.sh" .github/scripts/setup-agent-env.sh
          rm -rf .defaults

      - name: Determine classify parameters
        id: params
        env:
          INPUT_EVENT_TYPE: ${{ inputs.event_type }}
          INPUT_SOURCE_REPO: ${{ inputs.source_repo }}
          INPUT_EVENT_PAYLOAD: ${{ inputs.event_payload }}
          INPUT_CLASSIFY_MODE: ${{ inputs.classify_mode }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MIN_CONFIDENCE: ${{ inputs.min_confidence }}
          INPUT_FILTER_CATEGORY: ${{ inputs.filter_category }}
          INPUT_SCREEN_ISSUES: ${{ inputs.screen_issues }}
        run: |
          set -euo pipefail

          # SECURITY: event_payload may contain attacker-controlled content
          # (issue titles, etc.). Extract only the numeric fields we need via
          # jq, never interpolate raw strings into shell or log output.

          # Determine source repo.
          if [[ -n "${INPUT_SOURCE_REPO}" ]]; then
            SOURCE_REPO="${INPUT_SOURCE_REPO}"
          elif [[ -n "${INPUT_EVENT_PAYLOAD}" ]]; then
            SOURCE_REPO=$(printf '%s' "${INPUT_EVENT_PAYLOAD}" | jq -r '.repository // empty' 2>/dev/null || echo "")
          fi

          # Default: use first enabled repo from config, not a hardcoded name.
          if [[ -z "${SOURCE_REPO:-}" ]]; then
            FIRST_REPO=$(yq '.repos | to_entries[] | select(.value.enabled == true) | .key' config.yaml 2>/dev/null | head -1)
            SOURCE_REPO="${GITHUB_REPOSITORY_OWNER}/${FIRST_REPO:-}"
          fi

          # Validate source_repo format before using it.
          if [[ ! "${SOURCE_REPO}" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::source_repo format invalid"
            exit 1
          fi

          # Determine mode and issue number.
          if [[ "${INPUT_EVENT_TYPE}" == "issues" && -n "${INPUT_EVENT_PAYLOAD}" ]]; then
            CLASSIFY_MODE="single"
            ISSUE_NUMBER=$(printf '%s' "${INPUT_EVENT_PAYLOAD}" | jq -r '.issue.number // empty')
            # Validate issue number is numeric.
            if [[ -n "${ISSUE_NUMBER}" && ! "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "::error::issue number from payload is not numeric"
              exit 1
            fi
          else
            CLASSIFY_MODE="${INPUT_CLASSIFY_MODE:-unclassified}"
            ISSUE_NUMBER="${INPUT_ISSUE_NUMBER:-}"
            if [[ "${CLASSIFY_MODE}" == "single" && -n "${ISSUE_NUMBER}" && ! "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "::error::issue_number must be a positive integer"
              exit 1
            fi
          fi

          echo "source_repo=${SOURCE_REPO}" >> "$GITHUB_OUTPUT"
          echo "classify_mode=${CLASSIFY_MODE}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${INPUT_DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          echo "min_confidence=${INPUT_MIN_CONFIDENCE:-0.7}" >> "$GITHUB_OUTPUT"
          echo "filter_category=${INPUT_FILTER_CATEGORY:-}" >> "$GITHUB_OUTPUT"
          echo "screen_issues=${INPUT_SCREEN_ISSUES:-true}" >> "$GITHUB_OUTPUT"

          echo "::notice::Mode=${CLASSIFY_MODE} Repo=${SOURCE_REPO} Issue=${ISSUE_NUMBER:-<batch>} DryRun=${INPUT_DRY_RUN:-false} Screen=${INPUT_SCREEN_ISSUES:-true}"

      - name: Validate source repo is enrolled
        env:
          SOURCE_REPO: ${{ steps.params.outputs.source_repo }}
          EVENT_TYPE: ${{ steps.params.outputs.classify_mode == 'single' && inputs.event_type || 'manual' }}
        run: |
          if [[ ! "$SOURCE_REPO" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid source_repo format: must be owner/repo"
            exit 1
          fi

          # Shim dispatches (issue events) must target same-org repos.
          # Manual workflow_dispatch allows cross-org repos for testing.
          if [[ "$EVENT_TYPE" == "issues" ]]; then
            REPO_OWNER="${SOURCE_REPO%%/*}"
            if [[ "$REPO_OWNER" != "$GITHUB_REPOSITORY_OWNER" ]]; then
              echo "::error::source_repo owner does not match org"
              exit 1
            fi
            REPO_NAME="${SOURCE_REPO#*/}"
            ENABLED=$(yq ".repos.\"$REPO_NAME\".enabled" config.yaml 2>/dev/null)
            if [[ "$ENABLED" != "true" ]]; then
              echo "::error::repo is not enabled in config.yaml"
              exit 1
            fi
          else
            echo "::notice::Manual dispatch — skipping enrollment check for ${SOURCE_REPO}"
          fi

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # Reuse triage app (has issues:write + organization_projects:write).
          # TODO: create a dedicated gh-classify app when promoted to first-class.
          client-id: ${{ vars.FULLSEND_GH_CLASSIFY_CLIENT_ID || vars.FULLSEND_TRIAGE_CLIENT_ID }}
          private-key: ${{ secrets.FULLSEND_GH_CLASSIFY_APP_PRIVATE_KEY || secrets.FULLSEND_TRIAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Authenticate to Google Cloud (WIF)
        if: vars.FULLSEND_GCP_AUTH_MODE == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.FULLSEND_GCP_WIF_SA_EMAIL }}

      - name: Authenticate to Google Cloud (SA key)
        if: vars.FULLSEND_GCP_AUTH_MODE != 'wif'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FULLSEND_GCP_SA_KEY_JSON }}

      # GCP_OIDC_TOKEN_FILE is expected by google-github-actions/auth when using
      # WIF. For non-WIF (SA key), we set it to an empty file to avoid undefined
      # variable errors in downstream steps that may reference it.
      - name: Set GCP_OIDC_TOKEN_FILE for non-WIF
        if: vars.FULLSEND_GCP_AUTH_MODE != 'wif'
        run: |
          touch "$RUNNER_TEMP/empty-oidc-token"
          echo "GCP_OIDC_TOKEN_FILE=$RUNNER_TEMP/empty-oidc-token" >> "${GITHUB_ENV}"

      - name: Mask GCP credential file paths
        run: |
          for var in GOOGLE_GHA_CREDS_PATH GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE; do
            val="${!var:-}"
            if [[ -n "${val}" ]]; then
              echo "::add-mask::${val}"
            fi
          done

      - name: Prepare sandbox credentials
        run: bash scripts/prepare-sandbox-credentials.sh

      - name: Setup agent environment
        env:
          AGENT_PREFIX: CLASSIFY_
          CLASSIFY_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLASSIFY_SOURCE_REPO: ${{ steps.params.outputs.source_repo }}
          CLASSIFY_MODE: ${{ steps.params.outputs.classify_mode }}
          CLASSIFY_ISSUE_NUMBER: ${{ steps.params.outputs.issue_number || '0' }}
          CLASSIFY_DRY_RUN: ${{ steps.params.outputs.dry_run }}
          CLASSIFY_MIN_CONFIDENCE: ${{ steps.params.outputs.min_confidence }}
          CLASSIFY_PROJECT_NUMBER: ${{ vars.FULLSEND_GH_CLASSIFY_PROJECT_NUMBER || vars.FULLSEND_PROJECT_NUMBER || '1' }}
          CLASSIFY_FIELD_NAME: ${{ vars.FULLSEND_GH_CLASSIFY_FIELD_NAME || 'Workstream Category' }}
          CLASSIFY_ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          CLASSIFY_CLOUD_ML_REGION: ${{ vars.FULLSEND_GCP_REGION }}
          CLASSIFY_FILTER_CATEGORY: ${{ steps.params.outputs.filter_category || '__all__' }}
          CLASSIFY_SCREEN_ISSUES: ${{ steps.params.outputs.screen_issues }}
          CLASSIFY_CATEGORIES_PATH: ${{ vars.FULLSEND_GH_CLASSIFY_CATEGORIES_PATH || 'categories.md' }}
        run: bash .github/scripts/setup-agent-env.sh

      - name: Prepare target-repo placeholder
        run: mkdir -p "${GITHUB_WORKSPACE}/target-repo"

      - name: Run classify agent
        uses: fullsend-ai/fullsend@v0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLASSIFY_SOURCE_REPO: ${{ steps.params.outputs.source_repo }}
          CLASSIFY_MODE: ${{ steps.params.outputs.classify_mode }}
          CLASSIFY_ISSUE_NUMBER: ${{ steps.params.outputs.issue_number || '0' }}
          CLASSIFY_DRY_RUN: ${{ steps.params.outputs.dry_run }}
          CLASSIFY_MIN_CONFIDENCE: ${{ steps.params.outputs.min_confidence }}
          CLASSIFY_PROJECT_NUMBER: ${{ vars.FULLSEND_GH_CLASSIFY_PROJECT_NUMBER || vars.FULLSEND_PROJECT_NUMBER || '1' }}
          CLASSIFY_FIELD_NAME: ${{ vars.FULLSEND_GH_CLASSIFY_FIELD_NAME || 'Workstream Category' }}
          CLASSIFY_FILTER_CATEGORY: ${{ steps.params.outputs.filter_category || '__all__' }}
          CLASSIFY_SCREEN_ISSUES: ${{ steps.params.outputs.screen_issues }}
          CLASSIFY_CATEGORIES_PATH: ${{ vars.FULLSEND_GH_CLASSIFY_CATEGORIES_PATH || 'categories.md' }}
          CLASSIFY_PROJECT_TOKEN: ${{ secrets.FULLSEND_GH_CLASSIFY_PROJECT_PAT || '__none__' }}
        with:
          agent: gh-classify
