# Renovate dependency update bot.
#
# Required setup:
#   1. Set repository variable RENOVATE_APP_ID to the App ID.
#   2. Set repository secret RENOVATE_PRIVATE_KEY to the App's PEM private key.
#   (Same App used by fullsend-ai/fullsend)
name: Renovate

on:
  schedule:
    - cron: "13 3,15 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run Renovate in dry-run mode"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - full

permissions: {}

jobs:
  renovate:
    if: github.repository_owner == 'fullsend-ai'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      - uses: renovatebot/github-action@3064367f740a1a91cca218698a63902689cce200 # v46.1.20
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dry-run || 'false' }}
          RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: '["^bash hack/update-agent-hashes\\.sh [a-f0-9]{40}$"]'
