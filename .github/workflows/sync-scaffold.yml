# Converge every repository in repos.yaml to the manifest: shim workflow,
# prioritize caller, managed .fullsend/config.yaml, variables and secrets.
#
# Runs when fullsend-ai/fullsend publishes a release (its notify-scaffold-sync
# workflow dispatches fullsend-updated here; a release event of another
# repository cannot trigger this workflow directly), weekly, and by hand (with
# a dry-run option). The installer and validator are built from the ref in
# github.fullsend_ref, resolved once to a commit SHA. Installed workflow refs
# retain the configured value, so branch refs such as main keep tracking merges.
#
# Apply runs push drift fixes directly to each repository's default branch.
# Manual dry runs preview the same direct delivery without writing.
#
# Required setup:
#   1. Set repository variable SYNC_CLIENT_ID to the fullsend-ai-sync App Client ID.
#   2. Set repository secret SYNC_PRIVATE_KEY to the App's PEM private key.
#   3. The App must be installed on all target repos with contents and
#      workflows write, plus actions variables and secrets write.
#   4. The App must be allowed to push to each default branch by its rulesets.
name: Sync Scaffold

on:
  repository_dispatch:
    types: [fullsend-updated]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; write nothing to the repositories
        type: boolean
        default: true
      repos:
        description: Optional space-separated owner/repo selectors (default all)
        type: string
        default: ""

permissions: {}

concurrency:
  group: sync-scaffold
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'fullsend-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Build installer and validator from manifest ref; run regression tests
        run: |
          set -euo pipefail
          bash hack/build-fullsend.sh "$RUNNER_TEMP/fullsend-bin"
          echo "$RUNNER_TEMP/fullsend-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/fullsend-bin:$PATH"

      - name: Validate the complete fleet manifest before requesting credentials
        run: validate-manifest repos.yaml

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.SYNC_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_PRIVATE_KEY }}
          owner: fullsend-ai

      - name: Converge per-repo installs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REPOS: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          # An empty selector means every repository in the manifest.
          if [[ -n "$REPOS" ]] && ! printf '%s' "$REPOS" | grep -Eq '^[A-Za-z0-9_./* -]*$'; then
            echo "repos input may only contain owner/repo selectors" >&2
            exit 1
          fi
          # This checkout is discarded after the run, so an edit that install
          # writes to repos.yaml here is lost. With the file read-only,
          # install names the edit instead, to be made in a pull request.
          chmod a-w repos.yaml
          args=(repos install -f repos.yaml --direct)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          # shellcheck disable=SC2086
          fullsend "${args[@]}" $REPOS 2>&1 | tee sync.log

      - name: Publish Sync Scaffold summary
        if: always()
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo '## Sync Scaffold'
            echo
            echo "Mode: $([ "$DRY_RUN" = "true" ] && echo 'dry-run (direct preview)' || echo 'apply (direct)')"
            if [[ -f "$RUNNER_TEMP/fullsend-bin/fullsend-source-ref" && -f "$RUNNER_TEMP/fullsend-bin/fullsend-source-revision" ]]; then
              echo "Fullsend source: $(cat "$RUNNER_TEMP/fullsend-bin/fullsend-source-ref") -> $(cat "$RUNNER_TEMP/fullsend-bin/fullsend-source-revision")"
            else
              echo 'Fullsend source ref and revision are unavailable; source resolution or build failed.'
            fi
            echo
            echo '```'
            if [[ -f sync.log ]]; then tail -n 60 sync.log; else echo 'Sync did not start.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
