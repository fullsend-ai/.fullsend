name: Manifest Check

# Always report the required check, including on unrelated PRs and merge groups.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manifest-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifest:
    name: validate-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build installer and validator from manifest ref; run regression tests
        run: |
          set -euo pipefail
          bash hack/build-fullsend.sh "$RUNNER_TEMP/fullsend-bin"
          echo "$RUNNER_TEMP/fullsend-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/fullsend-bin:$PATH"

      - name: Validate the complete fleet manifest
        run: |
          set -euo pipefail
          validate-manifest repos.yaml 2>&1 | tee validation.log

      - name: Publish validation result
        if: always()
        run: |
          {
            echo '## Required manifest validation'
            echo
            if [[ -f "$RUNNER_TEMP/fullsend-bin/fullsend-source-ref" && -f "$RUNNER_TEMP/fullsend-bin/fullsend-source-revision" ]]; then
              echo "Configured Fullsend ref: $(cat "$RUNNER_TEMP/fullsend-bin/fullsend-source-ref")"
              echo "Resolved Fullsend revision: $(cat "$RUNNER_TEMP/fullsend-bin/fullsend-source-revision")"
            else
              echo 'Fullsend source resolution failed before build completed.'
            fi
            echo '```'
            if [[ -f validation.log ]]; then cat validation.log; else echo 'Build or regression tests failed before validation.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: advisory-plan
    needs: validate-manifest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Privileged previews execute tooling from the reviewed base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: candidate
          persist-credentials: false

      - name: Check whether all proposed Fullsend refs match the trusted manifest
        id: reviewed
        run: |
          set -euo pipefail
          manifest_refs() {
            ruby -ryaml -e '
              manifest = YAML.safe_load_file(ARGV.fetch(0), aliases: true)
              refs = []
              %w[github gitlab].each do |platform|
                section = manifest.is_a?(Hash) && manifest[platform].is_a?(Hash) ? manifest[platform] : {}
                refs << "#{platform}.fullsend_ref=#{section.fetch("fullsend_ref", "")}"
                Array(section["repos"]).each do |entry|
                  next unless entry.is_a?(Hash) && entry.key?("fullsend_ref")
                  refs << "#{platform}.repos[#{entry.fetch("name", "")}].fullsend_ref=#{entry["fullsend_ref"]}"
                end
              end
              puts refs.sort
            ' "$1"
          }
          trusted_refs=$(manifest_refs trusted/repos.yaml)
          candidate_refs=$(manifest_refs candidate/repos.yaml)
          if [[ "$trusted_refs" == "$candidate_refs" ]]; then
            echo 'preview=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Fullsend ref changes receive strict validation; run a manual Sync Scaffold dry run after merge for the privileged preview.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build trusted CLI from the reviewed base
        if: steps.reviewed.outputs.preview == 'true'
        run: |
          set -euo pipefail
          bash trusted/hack/build-fullsend.sh "$RUNNER_TEMP/fullsend-bin"
          echo "$RUNNER_TEMP/fullsend-bin" >> "$GITHUB_PATH"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: steps.reviewed.outputs.preview == 'true'
        id: app-token
        with:
          client-id: ${{ vars.SYNC_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_PRIVATE_KEY }}
          owner: fullsend-ai

      # Adoption/drift failures remain advisory; invalid manifests fail the
      # separate required job before any fleet credential is requested.
      - name: Advisory repos status
        if: steps.reviewed.outputs.preview == 'true'
        continue-on-error: true
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          fullsend repos status -f repos.yaml 2>&1 | tee status.log || true
          {
            echo '## Advisory repos status'
            echo '```'
            cat status.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Advisory repos install --dry-run
        if: steps.reviewed.outputs.preview == 'true'
        continue-on-error: true
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          fullsend repos install -f repos.yaml --dry-run 2>&1 | tee dryrun.log || true
          {
            echo '## Advisory repos install --dry-run'
            echo '```'
            cat dryrun.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
